<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">失败分析流程</title><desc id="desc">从既有运行材料中整理证据，按规则归因，再回到原始材料复核。</desc>
