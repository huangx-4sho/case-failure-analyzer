<rect width="1000" height="390" fill="#fff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><rect x="8" y="14" width="228" height="326" rx="24" fill="#f7f3e7" stroke="#b8aa83" stroke-width="2" stroke-dasharray="7 6"/><text x="28" y="49" font-size="15" font-weight="600" text-anchor="start" fill="#b8aa83">01</text><text x="122" y="79" font-size="26" font-weight="650" text-anchor="middle" fill="#30343b">读取材料</text><use href="#files" x="72" y="102" width="100" height="100" stroke="#30343b" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/><text x="122" y="237" font-size="18" font-weight="400" text-anchor="middle" fill="#30343b">日志与智能体轨迹</text><text x="122" y="264" font-size="18" font-weight="400" text-anchor="middle" fill="#30343b">任务、验证器与交付物</text><rect x="24" y="288" width="196" height="33" rx="16" fill="#fff" fill-opacity="0.72"/><text x="122" y="310" font-size="16" font-weight="500" text-anchor="middle" fill="#505860">只读输入</text><path d="M239 158h17" stroke="#62676b" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="260" y="14" width="228" height="326" rx="24" fill="#eaf3fa" stroke="#8caac3" stroke-width="2" stroke-dasharray="7 6"/><text x="280" y="49" font-size="15" font-weight="600" text-anchor="start" fill="#8caac3">02</text><text x="374" y="79" font-size="26" font-weight="650" text-anchor="middle" fill="#30343b">核对证据</text><use href="#match" x="324" y="102" width="100" height="100" stroke="#30343b" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/><text x="374" y="237" font-size="18" font-weight="400" text-anchor="middle" fill="#30343b">关联工具调用与结果</text><text x="374" y="264" font-size="18" font-weight="400" text-anchor="middle" fill="#30343b">比对字段、数值与契约</text><rect x="276" y="288" width="196" height="33" rx="16" fill="#fff" fill-opacity="0.72"/><text x="374" y="310" font-size="16" font-weight="500" text-anchor="middle" fill="#505860">提取与匹配</text><path d="M491 158h17" stroke="#62676b" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="512" y="14" width="228" height="326" rx="24" fill="#fff0dc" stroke="#c3a05f" stroke-width="2" stroke-dasharray="7 6"/><text x="532" y="49" font-size="15" font-weight="600" text-anchor="start" fill="#c3a05f">03</text><text x="626" y="79" font-size="26" font-weight="650" text-anchor="middle" fill="#30343b">规则归因</text><use href="#rules" x="576" y="102" width="100" height="100" stroke="#30343b" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/><text x="626" y="237" font-size="18" font-weight="400" text-anchor="middle" fill="#30343b">按优先级检查归因规则</text><text x="626" y="264" font-size="18" font-weight="400" text-anchor="middle" fill="#30343b">证据不足时保留未知</text><rect x="528" y="288" width="196" height="33" rx="16" fill="#fff" fill-opacity="0.72"/><text x="626" y="310" font-size="16" font-weight="500" text-anchor="middle" fill="#505860">固定规则顺序</text><path d="M743 158h17" stroke="#62676b" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="764" y="14" width="228" height="326" rx="24" fill="#f2eaf7" stroke="#b398c5" stroke-width="2" stroke-dasharray="7 6"/><text x="784" y="49" font-size="15" font-weight="600" text-anchor="start" fill="#b398c5">04</text><text x="878" y="79" font-size="26" font-weight="650" text-anchor="middle" fill="#30343b">报告复核</text><use href="#report" x="828" y="102" width="100" height="100" stroke="#30343b" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/><text x="878" y="237" font-size="18" font-weight="400" text-anchor="middle" fill="#30343b">查看摘要与根因报告</text><text x="878" y="264" font-size="18" font-weight="400" text-anchor="middle" fill="#30343b">沿证据引用核实结论</text><rect x="780" y="288" width="196" height="33" rx="16" fill="#fff" fill-opacity="0.72"/><text x="878" y="310" font-size="16" font-weight="500" text-anchor="middle" fill="#505860">人工或智能体复核</text><text x="500" y="374" font-size="17" font-weight="400" text-anchor="middle" fill="#646b73">分析已有记录，不重跑科学计算；提示和分数仍需结合证据解释。</text></g></svg>
