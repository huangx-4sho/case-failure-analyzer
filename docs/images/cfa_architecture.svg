<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">CFA analysis workflow / 分析流程</title>
  <desc id="desc">Logs, trajectories, task definitions, verifier code, and collected artifacts feed evidence extraction and fixed attribution rules. Reports retain evidence references for review. Scores and hints are heuristic.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="900" height="280" fill="#fff"/>
  <g fill="#f8fafc" stroke="#cbd5e1">
    <rect x="16" y="20" width="264" height="204" rx="4"/>
    <rect x="318" y="20" width="264" height="204" rx="4"/>
    <rect x="620" y="20" width="264" height="204" rx="4"/>
  </g>
  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M288 122H308"/>
    <path d="M590 122H610"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g font-size="20" font-weight="600" fill="#0f172a">
      <text x="36" y="56">输入 / Inputs</text>
      <text x="338" y="56">分析 / Analysis</text>
      <text x="640" y="56">复核 / Review</text>
    </g>
    <g font-size="16" fill="#334155">
      <text x="36" y="91">日志与轨迹</text>
      <text x="36" y="115">Logs and trajectories</text>
      <text x="36" y="151">任务、验证器与交付物</text>
      <text x="36" y="175">Task, verifier, artifacts</text>
      <text x="338" y="91">整理证据、核对数值</text>
      <text x="338" y="115">Extract and compare evidence</text>
      <text x="338" y="151">按固定优先级归因</text>
      <text x="338" y="175">Apply Gate 0–6 in order</text>
      <text x="640" y="91">报告、依据与规则记录</text>
      <text x="640" y="115">Report, evidence, decision trace</text>
      <text x="640" y="151">回到原始证据核实结论</text>
      <text x="640" y="175">Check claims against sources</text>
    </g>
    <text x="16" y="259" font-size="15" fill="#64748b">提示和分数需结合证据解释 / Hints and scores require interpretation against the evidence.</text>
  </g>
</svg>
